<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    
    <section class="project ecommerce-project">

        <h1><strong>E-Commerce Project</strong></h1>

        <div class="product">

            <div class="product-image">

                <span class="sales-badge">SALE</span>

                <div class="product-photo">
                    <img src="images/shoes.png" alt="Sports Running Shoes">
                </div>

            </div>

            <div class="product-info">

                <div>
                    <h2>Sports Running Shoes</h2>

                    <p class="rating">
                        &#9734;&#9734;&#9734;&#9734;&#9734;
                    </p>

                    <p>
                        Comfortable running shoes designed for
                        everyday fitness and sports activities.
                    </p>
                </div>

                <div>
                    <h3 class="price">Rs. 1,999</h3>
                    <p class="old-price">Rs. 2,999</p>
                </div>

                <button class="buy-button">Add to Cart</button>

            </div>

        </div>


        <h2 class="related-title">Related Products</h2>

        <div class="related-products">

            <div class="related-card">

                <div class="related-image">
                    <img src="images/pair of shoes.png"
                         alt="Running Shoes">
                </div>

                <h3>Running Shoes</h3>
                <p>Rs. 1,499</p>

            </div>


            <div class="related-card">

                <div class="related-image">
                    <img src="images/sports t-shirt.png"
                         alt="Sports T-Shirt">
                </div>

                <h3>Sports T-Shirt</h3>
                <p>Rs. 1,000</p>

            </div>


            <div class="related-card">

                <div class="related-image">
                    <img src="images/sports bags.png"
                         alt="Sports Bag">
                </div>

                <h3>Sports Bags</h3>
                <p>Rs. 999</p>

            </div>

        </div>

    </section>

</body>
</html>
