<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <section class="project dashboard-project">

        <h1>2. Admin Dashboard</h1>

        <aside class="sidebar">

            <h2>Admin</h2>

            <a href="#">Dashboard</a>
            <a href="#">Users</a>
            <a href="#">Products</a>
            <a href="#">Orders</a>
            <a href="#">Settings</a>

        </aside>

        <div class="dashboard-main">

            <nav class="dashboard-navbar">

                <h2>Dashboard</h2>

                <div>

                    <span>Welcome, Admin</span>

                    <button type="button">
                        Logout
                    </button>

                </div>

            </nav>

            <div class="dashboard-grid">

                <div class="dashboard-card">

                    <h3>Total Users</h3>

                    <p>2,540</p>

                </div>

                <div class="dashboard-card">

                    <h3>Total Orders</h3>

                    <p>1,240</p>

                </div>

                <div class="dashboard-card">

                    <h3>Total Sales</h3>

                    <p>₹85,000</p>

                </div>

                <div class="dashboard-card">

                    <h3>Products</h3>

                    <p>540</p>

                </div>
                
                <div class="dashboard-card large">

                    <h3>Recent Activity</h3>

                    <p>
                        User Rajat purchased a new product.
                    </p>

                    <p>
                        New order received.
                    </p>

                    <p>
                        New user registered.
                    </p>

                </div>


            </div>

        </div>

    </section>

</body>

</html>
